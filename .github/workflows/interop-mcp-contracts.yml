name: mcp-contracts interop

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/argwitness/contracts.py"
      - "src/argwitness/engine.py"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/interop-mcp-contracts.yml"

permissions:
  contents: read

jobs:
  upstream-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ArgWitness
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout pinned mcp-contracts fixtures
        uses: actions/checkout@v5
        with:
          repository: mcp-contracts/mcp-contracts
          ref: 5228e7ad71b080c3d56001b3019289703f5dc231
          path: .interop/mcp-contracts
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ArgWitness from this commit
        run: python -m pip install .

      - name: Compare real upstream snapshot fixtures
        shell: bash
        run: |
          set +e
          argwitness compare             .interop/mcp-contracts/packages/core/src/__fixtures__/server-v1.mcpc.json             .interop/mcp-contracts/packages/core/src/__fixtures__/server-v2-breaking.mcpc.json             --format json > /tmp/argwitness-mcp-contracts.json
          code=$?
          set -e
          test "$code" -eq 1

          python - <<'PY'
          import json
          with open("/tmp/argwitness-mcp-contracts.json", encoding="utf-8") as fh:
              report = json.load(fh)
          assert report["status"] == "breaking", report
          assert any(
              finding.get("tool") == "delete_contact"
              and finding.get("code") == "AW001"
              and finding.get("status") == "breaking"
              for finding in report["findings"]
          ), report
          PY
