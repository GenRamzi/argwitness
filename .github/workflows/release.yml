name: Release ArgWitness

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install --upgrade build twine

      - name: Validate tag and package version
        shell: bash
        run: |
          package_version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          test "$GITHUB_REF_NAME" = "v$package_version" || {
            echo "tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          }

      - name: Run source validation
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
          python examples/demo.py

      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ArgWitness $GITHUB_REF_NAME" \
            --generate-notes
