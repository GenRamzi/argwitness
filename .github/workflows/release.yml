name: Release ArgWitness

on:
  push:
    tags: ["v*"]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish, for example 0.1.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-argwitness
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name != 'issues' ||
      (github.actor == 'GenRamzi' && github.event.issue.title == 'release: argwitness 0.1.0')
    name: Build, publish, and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install --upgrade build twine

      - name: Read and validate package version
        id: package
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          package_version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME:-}" == "issues" ]]; then
            if [[ "${GITHUB_ACTOR:-}" != "GenRamzi" || "$package_version" != "0.1.0" ]]; then
              echo "issue-triggered release is restricted to GenRamzi and version 0.1.0" >&2
              exit 1
            fi
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$package_version" || {
              echo "tag $GITHUB_REF_NAME does not match package version $package_version" >&2
              exit 1
            }
          elif [[ -n "${REQUESTED_VERSION:-}" && "$REQUESTED_VERSION" != "$package_version" ]]; then
            echo "requested version $REQUESTED_VERSION does not match package version $package_version" >&2
            exit 1
          fi

      - name: Run source validation
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
          python examples/demo.py
          python -m pip check

      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/argwitness-wheel
          /tmp/argwitness-wheel/bin/python -m pip install --quiet dist/*.whl
          cd /tmp
          /tmp/argwitness-wheel/bin/argwitness --version

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

      - name: Generate checksums for GitHub Release
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.package.outputs.version }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "ArgWitness v${{ steps.package.outputs.version }}" \
            --generate-notes
