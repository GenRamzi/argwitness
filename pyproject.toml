[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argwitness"
version = "0.2.0"
description = "Concrete counterexamples for breaking AI tool contracts. Offline, cross-provider, evidence-first."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GenRamzi"}]
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.35,<1"]
keywords = ["mcp", "ai-agents", "json-schema", "contract-testing", "compatibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
argwitness = "argwitness.cli:main"

[project.urls]
Repository = "https://github.com/GenRamzi/argwitness"
Documentation = "https://github.com/GenRamzi/argwitness/tree/main/docs"
Changelog = "https://github.com/GenRamzi/argwitness/blob/main/CHANGELOG.md"
Issues = "https://github.com/GenRamzi/argwitness/issues"

[tool.setuptools.packages.find]
where = ["src"]
